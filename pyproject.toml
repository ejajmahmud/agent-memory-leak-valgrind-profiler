[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-leak-valgrind-profiler"
version = "0.1.0"
description = "Lightweight tracemalloc-based memory leak detector identifying unclosed sockets, growing cache dicts, and circular reference cycles"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-memory-leak-valgrind-profiler = "agent_memory_leak_valgrind_profiler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_memory_leak_valgrind_profiler*"]
